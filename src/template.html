<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tlakové pole a vítr nad Evropou</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* dark theme (default) */
:root{
  --bg:#070b14; --panel:#0e1524; --panel2:#141d30; --line:#223050; --text:#dce4f2; --mute:#8b99b5; --text2:#c3cde0; --strong:#e9eefa;
  --acc:#7cc4ff; --warn:#e879f9; --on:#1d3157; --onText:#fff; --hover:#36507f; --inset:#0a101c; --code:#18223a; --kbd:#1b2741; --kbdLine:#2c3d63;
  --hud:rgba(7,11,20,.78); --hudLine:rgba(124,196,255,.18); --barMid:#4a5c80; --trF:#ffb26b; --trB:#7ee0ff;
  /* probe: forces diagram and vertical-motion bars */
  --fP:#ff6b6b; --fC:#5ab4ff; --fF:#ffc145; --fE:#c084fc; --fV:#fff; --fIso:rgba(255,255,255,.35); --fLo:#ff8a8a; --fHi:#8fb6ff;
  --wD:#4fb0ff; --wE:#7fe0a0; --wO:#d9b38c; --wT:#fff;
  color-scheme:dark;
  --font:'IBM Plex Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif; --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
/* light theme: chosen explicitly, or by the system when the user left it on auto */
:root[data-theme=light]{
  --bg:#e9edf3; --panel:#fbfcfe; --panel2:#eef1f6; --line:#d3dae6; --text:#1a2233; --mute:#5c6a82; --text2:#36435a; --strong:#0f1829;
  --acc:#1d6fd6; --warn:#b0279c; --on:#d9e7fb; --onText:#0c2b5a; --hover:#9db2d4; --inset:#f3f5f9; --code:#e8ecf3; --kbd:#eef1f6; --kbdLine:#c6cfdd;
  --hud:rgba(251,252,254,.88); --hudLine:rgba(29,111,214,.22); --barMid:#a3afc3; --trF:#d9730f; --trB:#0a93b8;
  --fP:#d93434; --fC:#1f73d1; --fF:#c98a00; --fE:#8b3fd9; --fV:#1a2233; --fIso:rgba(26,34,51,.35); --fLo:#c62828; --fHi:#1f5fbf;
  --wD:#1f7fd6; --wE:#2a9a5a; --wO:#a8763f; --wT:#1a2233;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.45 var(--font);overflow:hidden}
#app{display:flex;height:100vh;width:100vw}
#mapcol{flex:1;min-width:0;display:flex;flex-direction:column}
#mapwrap{position:relative;flex:1;min-height:0;overflow:hidden}
#map{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#panel{width:350px;flex:none;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#panel>header{padding:12px 16px 12px}
#panel>header #preset{margin-top:10px}
.hrow{display:flex;align-items:center;gap:6px}
.hrow h1{flex:1;min-width:0}
#lang{width:auto;padding:3px 4px;font-size:12px;font-family:var(--mono)}
button.icon{padding:3px;width:28px;height:27px;display:grid;place-items:center;color:var(--mute)}
button.icon:hover{color:var(--text)}
button.icon svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#panel>section{padding:12px 16px 12px;flex:none}
/* tool palette (left) */
#tools{width:80px;flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;padding:8px 6px}
#tools button{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px 6px;border:1px solid transparent;background:transparent;border-radius:8px;font-size:10.5px;color:var(--mute)}
#tools button:hover{background:var(--panel2);color:var(--text)}
#tools button.on{background:var(--on);border-color:var(--acc);color:var(--onText)}
#tools svg{width:22px;height:22px}
#tools hr{border:0;border-top:1px solid var(--line);margin:6px 8px;width:calc(100% - 16px)}
#tools span{text-align:center;line-height:1.15} /* 80 px fits the longest word (Temperature, 63 px) */
.vn{display:flex;height:22px}.vn .sym{width:17px;height:17px;font-size:10.5px}.vn .sym.lo{margin:5px 0 0 -4px}
#tools kbd{position:absolute;top:3px;right:5px;font-family:var(--mono);font-size:9.5px;color:var(--mute);opacity:.8}
.sym{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:#f2f4f8;font:700 13px/1 var(--font);font-style:normal}
.sym.hi{color:#1d55c2;box-shadow:0 0 0 1.5px #2f6fe0}.sym.lo{color:#d12f2f;box-shadow:0 0 0 1.5px #e03b3b}
/* contextual options bar (top) and time bar (bottom) */
#optbar,#timebar{flex:none;display:flex;align-items:center;gap:14px;padding:0 14px;background:var(--panel);font-size:12.5px;height:46px;overflow:hidden}
#optbar{border-bottom:1px solid var(--line)}
#timebar{border-top:1px solid var(--line)}
.opt{display:flex;align-items:center;gap:12px;white-space:nowrap}
.opt{flex:1;min-width:0}
.opt>*{flex:none}
@media (max-width:1400px){#optSys .hint{display:none}}
.opt>.hint{flex:0 1 auto;color:var(--mute);overflow:hidden;text-overflow:ellipsis;min-width:0}
.opt .hint b{color:var(--text2);font-weight:600}
.opt kbd{font-family:var(--mono);font-size:11px;background:var(--kbd);border:1px solid var(--kbdLine);border-radius:4px;padding:0 4px}
label.ctl{display:flex;align-items:center;gap:7px;white-space:nowrap}
label.ctl input[type=range]{width:84px;flex:none}
label.ctl span.v{font-family:var(--mono);font-size:11.5px;color:var(--acc);min-width:46px}
.seg.sm button{padding:5px 9px;font-size:12px;flex:none}
/* sea chips: value on a second line, so the width depends only on the name */
#seaSeg button{display:flex;flex-direction:column;align-items:center;line-height:1.15;padding:3px 8px}
#seaSeg button em{font-style:normal;font-family:var(--mono);font-size:10.5px;color:var(--acc)}
#seaSeg button em.z{color:var(--mute);opacity:.6}
#seaSeg button.all{font-weight:600}
#timebar .play{min-width:104px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:7px}
#timebar .play svg{width:12px;height:12px;fill:currentColor}
#clock{font-family:var(--mono);font-size:12px;color:var(--text);margin-right:auto;white-space:nowrap}
/* options bar: label + value above the slider, so it fits on one line */
#optbar label.ctl{display:grid;grid-template-columns:1fr auto;column-gap:8px;font-size:11.5px;color:var(--mute);line-height:1.2}
#optbar label.ctl input[type=range]{grid-row:2;grid-column:1/3;width:104px;margin:3px 0 0}
#optbar label.ctl span.v{grid-row:1;grid-column:2;min-width:9ch;text-align:right;font-size:11px}
#optbar #pfLatV{min-width:11ch}
#timebar #tspeedV{min-width:6ch}
#optbar .opt{gap:16px}
/* layers panel */
#layers{border-top:1px solid var(--line)}
.lgrp{display:grid;grid-template-columns:74px 1fr;gap:6px;align-items:start;margin:5px 0}
.lgrp>b{font-size:11.5px;font-weight:500;color:var(--mute);padding-top:5px;line-height:1.25;overflow-wrap:anywhere}
.tiles{display:flex;flex-wrap:wrap;gap:4px}
.tiles button{padding:4px 8px;font-size:12px;border-radius:5px}
.tiles button.on{background:var(--on);border-color:var(--acc);color:var(--onText)}
#wSeg{margin:2px 0 8px 80px}
.ov{display:inline-flex;align-items:center;gap:6px;padding:4px 8px;font-size:12px;border-radius:5px}
.ov .eye{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2}
.ov .eye circle{fill:currentColor;stroke:none}
.ov.on{border-color:var(--hover);color:var(--strong)}.ov.on .eye{color:var(--acc)}
.ov:not(.on){color:var(--mute)}.ov:not(.on) .eye{opacity:.4}
.ov.forced{border-style:dashed;border-color:var(--hover)}
.lgrp>.seg{justify-self:start}
.seg.dis{opacity:.4;pointer-events:none}
#layers h2.sec{margin-top:16px}
.ovs{display:flex;flex-wrap:wrap;gap:4px}
/* tabs */
#tabs{display:flex;border-top:1px solid var(--line);border-bottom:1px solid var(--line);flex:none;padding:0 10px}
#tabs button{flex:1;border:0;border-bottom:2px solid transparent;border-radius:0;background:transparent;padding:9px 4px 7px;color:var(--mute);font-size:13px}
#tabs button.on{color:var(--strong);border-bottom-color:var(--acc)}
.tab{flex:1;min-height:0;overflow-y:auto;padding:12px 16px 30px}
.tab h2{font-size:11.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--mute);margin:0 0 9px;font-weight:600}
.tab.help{font-size:12.5px;color:var(--text2)}.tab.help p{margin:6px 0 9px}
.empty{color:var(--mute);font-size:13px;padding:10px 2px}
h1{font-size:17px;font-weight:600;margin:0 0 2px;letter-spacing:.01em}
.sub{color:var(--mute);font-size:12.5px;margin-bottom:12px}
section h2{font-size:11.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--mute);margin:0 0 9px;font-weight:600}
h3.mini{font-size:12.5px;font-weight:600;margin:12px 0 4px;color:var(--strong)}
label.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:7px 0;font-size:13px}
label.row span.v{font-family:var(--mono);font-size:12px;color:var(--acc);min-width:66px;text-align:right}
select,button{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 9px}
select{width:100%;cursor:pointer}
button{cursor:pointer}
button:hover,select:hover{border-color:var(--hover)}
button.on{background:var(--on);border-color:var(--acc)}
.btns{display:flex;gap:6px;flex-wrap:wrap}
.btns button{flex:1}
.btns.sm button{font-size:12.5px;padding:5px 6px}
.seg{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{flex:1;border:0;border-radius:0;padding:7px 3px;font-size:12px;background:transparent}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--on);color:var(--onText)}
input[type=range]{flex:1;max-width:140px;accent-color:var(--acc)}
.chk{display:flex;gap:6px 14px;flex-wrap:wrap;margin-top:9px;font-size:13px}
.chk label{display:flex;gap:5px;align-items:center;cursor:pointer}
.note{font-size:12px;color:var(--mute);margin-top:6px}
.trF{color:var(--trF)}.trB{color:var(--trB)}
[hidden]{display:none!important}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:12.5px;margin:6px 0 8px}
.kv b{font-weight:500;color:var(--mute)}
.kv span{font-family:var(--mono);font-size:12px;text-align:right}
#forces{width:100%;height:210px;background:var(--inset);border:1px solid var(--line);border-radius:8px;display:block}
.flegend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;margin-top:6px}
.flegend i{display:inline-block;width:10px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}
.explain{font-size:12.5px;color:var(--text2);margin-top:8px}
.wb{display:grid;grid-template-columns:118px 1fr 58px;align-items:center;gap:6px;font-size:11.8px;margin:3px 0}
.wb .bar{position:relative;height:9px;background:var(--inset);border:1px solid var(--line);border-radius:3px}
.wb .bar i{position:absolute;top:0;bottom:0;border-radius:2px}
.wb .bar:after{content:'';position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--barMid)}
.wb span{font-family:var(--mono);font-size:11.5px;text-align:right}
.wb.tot{font-weight:600}
details{font-size:12.5px;color:var(--text2)}
details summary{cursor:pointer;color:var(--text);font-weight:500;margin-bottom:6px}
details p{margin:6px 0}
code{font-family:var(--mono);font-size:11.5px;background:var(--code);padding:1px 4px;border-radius:4px}
.hud{position:absolute;pointer-events:none;font-size:12px;background:var(--hud);border:1px solid var(--hudLine);border-radius:7px;padding:6px 9px;backdrop-filter:blur(4px)}
#cursor{right:12px;bottom:12px;font-family:var(--mono);font-size:11.5px;white-space:nowrap}
#legend{left:12px;bottom:12px;width:290px}
#legend canvas{width:100%;height:10px;display:block;border-radius:3px;margin:4px 0 2px}
#legend .ticks{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10.5px;color:var(--mute)}
#legend .ttl{font-size:11.5px;color:var(--text2)}
#legend .x{font-size:11px;color:var(--mute);margin-top:3px}
@media (max-width:820px){
  html,body{overflow:auto}
  #app{flex-direction:column;height:auto}
  #tools{width:100%;flex-direction:row;border-right:0;border-bottom:1px solid var(--line);padding:4px 6px}
  #tools button{flex:1;flex-direction:row;justify-content:center;gap:6px}
  #tools kbd{display:none}
  #mapcol{flex:none;height:72vh}
  #optbar,#timebar{gap:10px;padding:0 10px;overflow-x:auto}
  #panel{width:100%;border-left:0;border-top:1px solid var(--line)}
  .tab{overflow:visible}
  #legend{width:210px}
}
</style>
</head>
<body>
<div id="app">
  <nav id="tools" data-ta="tools.aria">
    <button data-t="pres" data-tt="tool.pres.tt"><span class="vn"><i class="sym hi" data-tx="sym.H"></i><i class="sym lo" data-tx="sym.L"></i></span><span data-tx="tool.pres"></span><kbd>1</kbd></button>
    <button data-t="temp" data-tt="tool.temp.tt"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 4a2 2 0 0 1 4 0v9.5a4 4 0 1 1-4 0z"/><circle cx="12" cy="17" r="1.6" fill="currentColor"/></svg><span data-tx="tool.temp"></span><kbd>2</kbd></button>
    <button data-t="hum" data-tt="tool.hum.tt"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5s-6 6.8-6 10.9a6 6 0 0 0 12 0c0-4.1-6-10.9-6-10.9z"/></svg><span data-tx="tool.hum"></span><kbd>3</kbd></button>
    <button data-t="pf" data-tt="tool.pf.tt"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 15c3-5 6-5 9 0s6 5 9 0" stroke-dasharray="3 3"/><path d="M12 4v5M9.5 6.5 12 4l2.5 2.5"/></svg><span data-tx="tool.pf"></span><kbd>4</kbd></button>
    <button data-t="sea" data-tt="tool.sea.tt"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9c2-2 4-2 6 0s4 2 6 0 4-2 6 0M3 15c2-2 4-2 6 0s4 2 6 0 4-2 6 0"/></svg><span data-tx="tool.sea"></span><kbd>5</kbd></button>
    <hr>
    <button data-t="probe" data-tt="tool.probe.tt"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="6"/><path d="M12 2v5M12 17v5M2 12h5M17 12h5"/></svg><span data-tx="tool.probe"></span><kbd>6</kbd></button>
  </nav>
  <div id="mapcol">
    <div id="optbar">
      <div class="opt" id="optPres">
        <div class="seg sm" id="addSeg"><button data-a="1" data-tx="add.H" data-tt="add.H.tt"></button><button data-a="-1" data-tx="add.L" data-tt="add.L.tt"></button></div>
        <label class="ctl" data-tt="bg.tt"><span data-tx="bg"></span> <input type="range" id="bg" min="-20" max="30" step="1"><span class="v" id="bgV"></span></label>
        <span class="hint" data-tx="hint.pres"></span>
      </div>
      <div class="opt" id="optSys" hidden>
        <div class="seg sm"><button id="tH" data-tx="sys.H" data-tt="sys.H.tt"></button><button id="tL" data-tx="sys.L" data-tt="sys.L.tt"></button></div>
        <label class="ctl"><span data-tx="sys.amp"></span> <input type="range" id="amp" min="2" max="45" step="0.5"><span class="v" id="ampV"></span></label>
        <label class="ctl"><span data-tx="sys.size"></span> <input type="range" id="size" min="250" max="2500" step="10"><span class="v" id="sizeV"></span></label>
        <label class="ctl"><span data-tx="sys.aspect"></span> <input type="range" id="aspect" min="1" max="3.5" step="0.05"><span class="v" id="aspectV"></span></label>
        <label class="ctl"><span data-tx="sys.rot"></span> <input type="range" id="rot" min="0" max="179" step="1"><span class="v" id="rotV"></span></label>
        <button id="del" data-tx="sys.del" data-tt="sys.del.tt"></button>
        <span class="hint" data-tx="hint.sys"></span>
      </div>
      <div class="opt" id="optTemp" hidden>
        <div class="seg sm" id="tempSeg"><button data-m="cold" data-tx="temp.cold"></button><button data-m="warm" data-tx="temp.warm"></button></div>
        <label class="ctl"><span data-tx="brush.size"></span> <input type="range" class="brushR" min="150" max="700" step="10"><span class="v brushRV"></span></label>
        <span class="hint" data-tx="hint.brush"></span>
      </div>
      <div class="opt" id="optHum" hidden>
        <div class="seg sm" id="humSeg"><button data-m="moist" data-tx="hum.moist"></button><button data-m="dry" data-tx="hum.dry"></button></div>
        <label class="ctl"><span data-tx="brush.size"></span> <input type="range" class="brushR" min="150" max="700" step="10"><span class="v brushRV"></span></label>
        <span class="hint" data-tx="hint.brush"></span>
      </div>
      <div class="opt" id="optPf" hidden>
        <label class="ctl" data-tt="pf.lat.tt"><span data-tx="pf.lat"></span> <input type="range" id="pfLat" min="40" max="62" step="0.5"><span class="v" id="pfLatV"></span></label>
        <label class="ctl" data-tt="pf.dT.tt"><span data-tx="pf.dT"></span> <input type="range" id="pfDT" min="6" max="32" step="1"><span class="v" id="pfDTV"></span></label>
        <span class="hint" data-tx="hint.pf"></span>
      </div>
      <div class="opt" id="optSea" hidden>
        <div class="seg sm" id="seaSeg"></div>
        <label class="ctl" data-tt="sea.tt"><span id="sstName"></span> <input type="range" id="sst" min="-5" max="5" step="0.5"><span class="v" id="sstV"></span></label>
        <button id="seaReset" data-tx="sea.reset" data-tt="sea.reset.tt"></button>
        <span class="hint" data-tx="hint.sea"></span>
      </div>
      <div class="opt" id="optProbe" hidden>
        <span class="hint" data-tx="hint.probe"></span>
      </div>
    </div>
    <div id="mapwrap">
      <canvas id="map"></canvas>
      <div id="legend" class="hud"><div class="ttl" id="legTitle"></div><canvas id="legBar" width="290" height="10"></canvas><div class="ticks" id="legTicks"></div><div class="x" id="legX"></div></div>
      <div id="cursor" class="hud" hidden></div>
    </div>
    <div id="timebar">
      <button id="pause" class="play" data-tt="time.pause.tt"></button>
      <label class="ctl" data-tt="time.speed.tt"><span data-tx="time.speed"></span> <input type="range" id="tspeed" min="1" max="24" step="1"><span class="v" id="tspeedV"></span></label>
      <span id="clock"></span>
      <button id="resetT" data-tx="time.reset" data-tt="time.reset.tt"></button>
    </div>
  </div>
  <aside id="panel">
    <header>
      <div class="hrow">
        <h1 data-tx="app.h1"></h1>
        <select id="lang" data-tt="lang.tt"></select>
        <button id="theme" class="icon"></button>
      </div>
      <div class="sub" data-tx="app.sub"></div>
      <select id="preset" data-tt="preset.tt"></select>
    </header>

    <section id="layers">
      <h2 data-tx="lay.title"></h2>
      <div class="lgrp"><b data-tx="grp.wx"></b><div class="tiles"><button data-l="cloud" data-tx="lay.cloud" data-tt="lay.cloud.tt"></button><button data-l="precip" data-tx="lay.precip" data-tt="lay.precip.tt"></button><button data-l="vvel" data-tx="lay.vvel" data-tt="lay.vvel.tt"></button><button data-l="rh" data-tx="lay.rh" data-tt="lay.rh.tt"></button></div></div>
      <div class="seg sm" id="wSeg"><button data-w="tot" data-tx="w.tot"></button><button data-w="dyn" data-tx="w.dyn" data-tt="w.dyn.tt"></button><button data-w="ek" data-tx="w.ek" data-tt="w.ek.tt"></button><button data-w="oro" data-tx="w.oro"></button></div>

  else if(la>=30&&la<=46.5&&lo>-5.6&&lo<=37&&!(lo<0&&la>42))r=1;                    // Mediterranean
  else if(lo>=10.5&&lo<=30.5&&la>=53.5&&la<=66)r=3;                                 // Baltic

 {bg:2,pf:50,dT:20,s:[[-1,-10,57,26,850,1.3,30],[1,-24,38,13,1200,1.7,10],[1,38,52,12,1100,1.3,0]]},

 {bg:0,pf:50,dT:18,s:[[1,8,61,20,800,1.6,0],[-1,9,43,11,550,1.4,0]]},
 {bg:0,pf:47,dT:18,s:[[-1,18,49,17,550,1.2,30],[1,-12,52,14,1000,1.4,80],[1,34,60,8,900,1.2,0]]},

// ====================== pressure & wind ======================
const P=F32(),GX=F32(),GY=F32(),NXv=F32(),NYv=F32(),KAP=F32();
const UG=F32(),VG=F32(),UR=F32(),VR=F32(),UB=F32(),VB=F32(),US=F32(),VS=F32(),U3=F32(),V3=F32(),U7=F32(),V7=F32();
const ANOM=new Uint8Array(N),SPD=F32(),PU=F32(),PV=F32(),TU=F32(),TV=F32();
const WE=F32(),WO=F32(),WD=F32(),WT=F32();

function bgP(lat){const t=clamp((lat-50)/30,-1,1);return -S.bg*50*Math.sin(t*Math.PI/2);}

// ====================== contours ======================
function contour(F,step,base,cb){ // marching squares; cb(L,ax,ay,bx,by)
  for(let j=0;j<NY-1;j++){const y=YS(j);for(let i=0;i<NX-1;i++){const x=XS(i),k=j*NX+i;const v0=F[k],v1=F[k+1],v2=F[k+NX+1],v3=F[k+NX];
    const mn=Math.min(v0,v1,v2,v3),mx=Math.max(v0,v1,v2,v3);let L=step?Math.ceil((mn-base)/step)*step+base:base;

      const E={};if(b0!==b1){const t=(L-v0)/(v1-v0);E.t=[x+t*DX,y];}if(b1!==b2){const t=(L-v1)/(v2-v1);E.r=[x+DX,y-t*DX];}
      if(b3!==b2){const t=(L-v3)/(v2-v3);E.b=[x+t*DX,y-DX];}if(b0!==b3){const t=(L-v0)/(v3-v0);E.l=[x,y-t*DX];}
      let pairs;if(code===5||code===10){const c=(v0+v1+v2+v3)/4>L;
        if(code===10)pairs=c?[['t','r'],['b','l']]:[['l','t'],['r','b']];else pairs=c?[['l','t'],['r','b']]:[['t','r'],['b','l']];}
      else{const ks=Object.keys(E);pairs=[[ks[0],ks[1]]];}
      for(const [a,b] of pairs){const A=E[a],B=E[b];cb(L,A[0],A[1],B[0],B[1]);}}}}}
function placeLabels(segs,minAll,minSame,cap){const out=[];const step=Math.max(1,Math.floor(segs.length/2500));

    let ok=true;for(const q of out){const d=(q.X-X)**2+(q.Y-Y)**2;if(d<minAll*minAll||(q.L===L&&d<minSame*minSame)){ok=false;break;}}if(ok)out.push({L,X,Y});if(out.length>cap)break;}return out;}

const PH=F32();

// ====================== fronts ======================
const GT=F32(),MF=F32(),MN=F32(),GTX=F32(),GTY=F32(),NTX=F32(),NTY=F32(),ADV=F32(),FG=F32(),URX=F32(),URY=F32(),VRX=F32(),VRY=F32();
let FRONTS=[];
const FRONT_THR=1.4e-5; // K/m  (1.4 K / 100 km)
function buildFronts(){
  for(let k=0;k<N;k++){const g=Math.hypot(TX[k],TY[k]);GT[k]=g;NTX[k]=g>1e-9?TX[k]/g:0;NTY[k]=g>1e-9?TY[k]/g:0;ADV[k]=-(UR[k]*TX[k]+VR[k]*TY[k])*86400;}

  for(let k=0;k<N;k++){const tx=TX[k],ty=TY[k];FG[k]=GT[k]>1e-9?-(tx*tx*URX[k]+tx*ty*(VRX[k]+URY[k])+ty*ty*VRY[k])/GT[k]*86400*1e5:0;} // K/100km/day
  grad(GT,GTX,GTY);for(let k=0;k<N;k++)MF[k]=GTX[k]*NTX[k]+GTY[k]*NTY[k];
  grad(MF,GTX,GTY);for(let k=0;k<N;k++)MN[k]=GTX[k]*NTX[k]+GTY[k]*NTY[k];
  const segs=[];contour(MF,0,0,(L,ax,ay,bx,by)=>{const mx=(ax+bx)/2,my=(ay+by)/2;const ei=(mx-X0)/DX,ej=(Y1-my)/DX;if(ei<5||ej<5||ei>NX-6||ej>NY-6)return;if(samp(GT,mx,my)>FRONT_THR&&samp(MN,mx,my)<0&&samp(FG,mx,my)>0.6)segs.push([ax,ay,bx,by]);});

    for(const dir of [1,0]){while(true){const end=dir?pts[pts.length-1]:pts[0];const cand=(mp.get(key(end[0],end[1]))||[]).find(n=>!used[n]);if(cand===undefined)break;used[cand]=1;
      const s=segs[cand];const a=[s[0],s[1]],b=[s[2],s[3]];const nxt=key(a[0],a[1])===key(end[0],end[1])?b:a;if(dir)pts.push(nxt);else pts.unshift(nxt);}}

function drawFronts(){

function spawn(p,rnd){p.x=X0+Math.random()*(X1-X0);p.y=Y0+Math.random()*(Y1-Y0);p.age=rnd?Math.random()*120|0:0;p.max=60+Math.random()*120|0;return p;}

function hitEdge(X,Y){const s=selSys();if(!s||!marksOn())return null;const q=sysParams(s);const r=ellRho(s,q,px2x(X),py2y(Y));return Math.abs(r-1)*Math.min(q.a,q.b)*sc<8?s:null;}
function paint(X,Y,el){const x0=px2x(X),y0=py2y(Y);const i0=Math.round((x0-X0)/DX),j0=Math.round((Y1-y0)/DX),R=Math.ceil(S.brushR*2/DX);
  for(let j=Math.max(0,j0-R);j<=Math.min(NY-1,j0+R);j++)for(let i=Math.max(0,i0-R);i<=Math.min(NX-1,i0+R);i++){const k=j*NX+i,d2=((XS(i)-x0)**2+(YS(j)-y0)**2)/(S.brushR*S.brushR);if(d2>4)continue;const g=Math.exp(-d2)*el;
    if(S.brush==='cold')T[k]-=10*g;else if(S.brush==='warm')T[k]+=10*g;else if(S.brush==='moist')QV[k]+=(1.05*qs850(T[k])-QV[k])*Math.min(1,2*g);else if(S.brush==='dry'){QV[k]*=Math.max(0,1-1.5*g);CW[k]*=Math.max(0,1-2*g);}}
  brushDirty=true;}
let brushDirty=false;
// sea (REG index) under a point, -1 over land / outside
function seaAt(x,y){if(!inside(x,y))return -1;const k=Math.round((Y1-y)/DX)*NX+Math.round((x-X0)/DX);return SEA[k]?REG[k]:-1;}
let seaMask=null; // white silhouette of each sea, drawn like the raster with some alpha
function buildSeaMask(){seaMask=Array.from({length:NSEA},(_,r)=>{const c=document.createElement('canvas');c.width=NX;c.height=NY;const g2=c.getContext('2d'),im=g2.createImageData(NX,NY);
  for(let k=0;k<N;k++){im.data[k*4]=im.data[k*4+1]=im.data[k*4+2]=255;im.data[k*4+3]=SEA[k]&&REG[k]===r?255:0;}g2.putImageData(im,0,0);return c;});}
cv.addEventListener('pointerdown',e=>{const [X,Y]=evXY(e);cv.setPointerCapture(e.pointerId);const x=px2x(X),y=py2y(Y);
  if(S.brush){drag={k:'brush',X,Y};return;}
  if(S.tool==='pf'){drag={k:'pf'};setPf(inv(x,y)[1],S.pfDT);return;}
  if(S.tool==='probe'){if(inside(x,y)){drag={k:'probe'};setProbe(x,y);}return;}
  if(S.tool==='sea'){if(inside(x,y)){S.seaSel=-1;drag={k:'sea',Y,v0:seaMean()};refreshUI();}return;}
  if(S.tool!=='pres')return;
  const s=hitSys(X,Y);if(s){S.sel=s.id;drag={k:'move',s,X,Y,x0:s.x,y0:s.y};refreshUI();return;}
  const se=hitEdge(X,Y);if(se){const q=sysParams(se);drag={k:'edge',s:se,q,size0:se.size,r0:ellRho(se,q,px2x(X),py2y(Y))};return;}
  drag={k:'click',X,Y};});
cv.addEventListener('pointermove',e=>{const [X,Y]=evXY(e);hoverXY=[X,Y];const x=px2x(X),y=py2y(Y);
  if(drag&&drag.k==='move'){drag.s.x=clamp(drag.x0+(X-drag.X)/sc,X0,X1);drag.s.y=clamp(drag.y0-(Y-drag.Y)/sc,Y0,Y1);changed();}
  else if(drag&&drag.k==='edge'){const r=ellRho(drag.s,drag.q,x,y);drag.s.size=clamp(drag.size0*r/drag.r0,250,2500);refreshUI();changed();}
  else if(drag&&drag.k==='brush'){drag.X=X;drag.Y=Y;}
  else if(drag&&drag.k==='pf'){if(inside(x,y))setPf(Math.round(inv(x,y)[1]*2)/2,S.pfDT);}
  else if(drag&&drag.k==='probe'){if(inside(x,y))setProbe(x,y);}
  else if(drag&&drag.k==='sea'){const v=Math.round((drag.v0+(drag.Y-Y)/30)*2)/2;if(v!==seaMean())setSea(-1,v);}  // all seas, 30 px per K
  else{const h=S.tool==='pres'?hitSys(X,Y):null;hoverId=h?h.id:null;S.seaHover=S.tool==='sea'?seaAt(x,y):-1;
    cv.style.cursor=S.tool==='pres'?(h?'grab':hitEdge(X,Y)?'nwse-resize':S.sel?'default':'copy'):S.tool==='pf'?'ns-resize':S.tool==='sea'?'ns-resize':'crosshair';}
  updateCursor(X,Y);});
cv.addEventListener('pointerup',e=>{const [X,Y]=evXY(e);
  if(drag&&drag.k==='click'&&Math.hypot(X-drag.X,Y-drag.Y)<5){const x=px2x(X),y=py2y(Y);
    if(S.sel){S.sel=null;refreshUI();} // first click into empty space only deselects
    else if(inside(x,y)){const s={id:S.nextId++,type:S.addType,x,y,amp:14,size:800,aspect:1.3,rot:0};S.systems.push(s);S.sel=s.id;refreshUI();changed();}}
  if(drag&&drag.k!=='click')updateProbe();drag=null;});
cv.addEventListener('pointerleave',()=>{hoverXY=null;S.seaHover=-1;$('cursor').hidden=true;});
cv.addEventListener('wheel',e=>{const [X,Y]=evXY(e);const x=px2x(X),y=py2y(Y),dir=-Math.sign(e.deltaY);
  if(S.tool==='pf'){e.preventDefault();setPf(S.pfLat,S.pfDT+dir);return;}
  if(S.tool==='sea'){const g=seaAt(x,y);if(g<0)return;e.preventDefault();setSea(g,SEA_ANOM[g]+0.5*dir);return;}
  if(S.tool!=='pres')return;
  const ss=selSys();const s=hitSys(X,Y)||(ss&&ellRho(ss,sysParams(ss),x,y)<1?ss:null);if(!s)return;e.preventDefault();
  const f=Math.exp(dir*0.07);if(e.shiftKey)s.amp=clamp(s.amp*f,2,45);else s.size=clamp(s.size*f,250,2500);S.sel=s.id;refreshUI();changed();},{passive:false});
window.addEventListener('keydown',e=>{const tg=e.target;if(tg.tagName==='SELECT'||(tg.tagName==='INPUT'&&tg.type!=='range'&&tg.type!=='checkbox'))return;if((e.key==='Delete'||e.key==='Backspace')&&S.sel){$('del').click();e.preventDefault();}
  if(e.key==='Escape'&&S.sel){S.sel=null;refreshUI();}
  const m=/^(Digit|Numpad)([1-6])$/.exec(e.code);if(m&&!e.ctrlKey&&!e.metaKey&&!e.altKey)setTool(TOOL_KEYS[+m[2]-1]);
  if(e.code==='Space'){S.paused=!S.paused;refreshUI();e.preventDefault();}});
function updateCursor(X,Y){const x=px2x(X),y=py2y(Y),el=$('cursor');if(!inside(x,y)){el.hidden=true;return;}el.hidden=false;const [lon,lat]=inv(x,y);
  const u=samp(curU(),x,y),v=samp(curV(),x,y);const [d,n]=windFrom(u,v,lon,lat);
  let extra=` · ${f1(samp(T,x,y))} °C`;const L=lay();const sea=samp(LAND,x,y)<0.5;
  if(L==='cloud'||L==='rh')extra+=` · ${t('cur.cloud')} ${Math.round(samp(CF,x,y)*100)} %`;else if(L==='precip')extra+=` · ${f1(samp(PR,x,y),2)} mm/h`;else if(L==='vvel')extra+=` · w ${f1(samp(WT,x,y)*100)} cm/s`;else if(L==='dust')extra+=` · ${t('cur.dust')} ${f1(samp(DU,x,y),2)}`;
  else if(L==='teq')extra+=` · ${t('cur.teq')} ${f1(samp(TEQ,x,y))} °C`;else if(L==='sst'&&sea)extra+=` · ${t('cur.sea')} ${f1(samp(SST,x,y))} °C`;else if(L==='seaair'&&sea)extra+=` · ${t('cur.seaair')} ${f1(samp(SST,x,y)-samp(T,x,y))} K`;
  el.textContent=`${f1(lat)}°N ${f1(lon)}°E · ${f1(samp(P,x,y)/100)} hPa · ${f1(Math.hypot(u,v))} m/s ${t('cur.from')} ${n}${extra}`;}

// ====================== main loop ======================
let last=performance.now(),probeT=0;const STEP=1800;
function frame(now){const el=Math.min(0.1,(now-last)/1000);last=now;const fr=el*60;
  if(pending){pending=false;compute();if(GLR)velTexDirty=true;}
  if(drag&&drag.k==='brush')paint(drag.X,drag.Y,el);
  if(!S.paused){S.acc+=S.tspeed*3600*el;let n=0;while(S.acc>=STEP&&n<3){tracerStep(STEP);S.acc-=STEP;n++;}if(S.acc>STEP)S.acc=STEP;
    if(n){updateDyn(n*6);diagClouds();}}
  else if(brushDirty){updateDyn(8);diagClouds();}
  brushDirty=false;
  if(GLR&&velTexDirty){GLR.uploadV();velTexDirty=false;}
  if(!S.paused)stepParticles(Math.max(0.3,fr));draw((S.simT+S.acc)/3600);
  if(S.probe&&now-probeT>350){updateProbe();probeT=now;}
  const d=Math.floor(S.simT/86400),h=Math.floor((S.simT%86400)/3600);$('clock').textContent=t('time.clock',d,String(h).padStart(2,'0'));
  requestAnimationFrame(frame);}
// ====================== language & theme switching ======================
function applyLang(l){LANG=l;pref.set('lang',l);document.documentElement.lang=l;document.title=t('doc.title');$('lang').value=l;
  document.querySelectorAll('[data-tx]').forEach(el=>el.innerHTML=t(el.dataset.tx));
  document.querySelectorAll('[data-tt]').forEach(el=>el.title=t(el.dataset.tt));
  document.querySelectorAll('[data-ta]').forEach(el=>el.setAttribute('aria-label',t(el.dataset.ta)));
  t('presets').forEach((n,i)=>presetSel.options[i].textContent=n);$('theme').title=t('theme.'+themePref);refreshUI();updateProbe();}
for(const l of Object.keys(L10N)){const o=document.createElement('option');o.value=l;o.textContent=l.toUpperCase();o.title=L10N[l]._name;$('lang').appendChild(o);}
$('lang').onchange=e=>applyLang(e.target.value);
// theme: auto follows the system; the map itself stays dark (satellite-like), only the UI around it changes
const THEMES=['auto','light','dark'],mqDark=matchMedia('(prefers-color-scheme: dark)');let themePref=THEMES.includes(pref.get('theme'))?pref.get('theme'):'auto';
const THEME_ICON={auto:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg>',
  light:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  dark:'<svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>'};
let THEME={}; // canvas colours read from the CSS variables of the active theme
function applyTheme(){document.documentElement.dataset.theme=(themePref==='auto'?mqDark.matches:themePref==='dark')?'dark':'light';
  const cs=getComputedStyle(document.documentElement);THEME={};for(const k of ['bg','fP','fC','fF','fE','fV','fIso','fLo','fHi'])THEME[k]=cs.getPropertyValue('--'+k).trim();
  $('theme').innerHTML=THEME_ICON[themePref];$('theme').title=t('theme.'+themePref);updateProbe();}
mqDark.addEventListener('change',()=>{if(themePref==='auto')applyTheme();});
$('theme').onclick=()=>{themePref=THEMES[(THEMES.indexOf(themePref)+1)%THEMES.length];pref.set('theme',themePref);applyTheme();};
applyTheme();applyLang(pickLang());
new ResizeObserver(()=>resize()).observe($('mapwrap'));
resize();presetSel.value=0;loadPreset(0);setTab('probe');setTool('pres');requestAnimationFrame(frame);
</script>
