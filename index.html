<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tlakové pole a vítr nad Evropou</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* dark theme (default) */
:root{
  --bg:#070b14; --panel:#0e1524; --panel2:#141d30; --line:#223050; --text:#dce4f2; --mute:#8b99b5; --text2:#c3cde0; --strong:#e9eefa;
  --acc:#7cc4ff; --warn:#e879f9; --on:#1d3157; --onText:#fff; --hover:#36507f; --inset:#0a101c; --code:#18223a; --kbd:#1b2741; --kbdLine:#2c3d63;
  --hud:rgba(7,11,20,.78); --hudLine:rgba(124,196,255,.18); --barMid:#4a5c80; --trF:#ffb26b; --trB:#7ee0ff;
  /* probe: forces diagram and vertical-motion bars */
  --fP:#ff6b6b; --fC:#5ab4ff; --fF:#ffc145; --fE:#c084fc; --fV:#fff; --fIso:rgba(255,255,255,.35); --fLo:#ff8a8a; --fHi:#8fb6ff;
  --wD:#4fb0ff; --wE:#7fe0a0; --wO:#d9b38c; --wT:#fff;
  color-scheme:dark;
  --font:'IBM Plex Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif; --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
/* light theme: chosen explicitly, or by the system when the user left it on auto */
:root[data-theme=light]{
  --bg:#e9edf3; --panel:#fbfcfe; --panel2:#eef1f6; --line:#d3dae6; --text:#1a2233; --mute:#5c6a82; --text2:#36435a; --strong:#0f1829;
  --acc:#1d6fd6; --warn:#b0279c; --on:#d9e7fb; --onText:#0c2b5a; --hover:#9db2d4; --inset:#f3f5f9; --code:#e8ecf3; --kbd:#eef1f6; --kbdLine:#c6cfdd;
  --hud:rgba(251,252,254,.88); --hudLine:rgba(29,111,214,.22); --barMid:#a3afc3; --trF:#d9730f; --trB:#0a93b8;
  --fP:#d93434; --fC:#1f73d1; --fF:#c98a00; --fE:#8b3fd9; --fV:#1a2233; --fIso:rgba(26,34,51,.35); --fLo:#c62828; --fHi:#1f5fbf;
  --wD:#1f7fd6; --wE:#2a9a5a; --wO:#a8763f; --wT:#1a2233;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.45 var(--font);overflow:hidden}
#app{display:flex;height:100vh;width:100vw}
#mapcol{flex:1;min-width:0;display:flex;flex-direction:column}
#mapwrap{position:relative;flex:1;min-height:0;overflow:hidden}
#map{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#panel{width:350px;flex:none;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#panel>header{padding:12px 16px 12px}
#panel>header #preset{margin-top:10px}
.hrow{display:flex;align-items:center;gap:6px}
.hrow h1{flex:1;min-width:0}
#lang{width:auto;padding:3px 4px;font-size:12px;font-family:var(--mono)}
button.icon{padding:3px;width:28px;height:27px;display:grid;place-items:center;color:var(--mute)}
button.icon:hover{color:var(--text)}
button.icon svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#panel>section{padding:12px 16px 12px;flex:none}
/* tool palette (left) */
#tools{width:80px;flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;padding:8px 6px}
#tools button{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px 6px;border:1px solid transparent;background:transparent;border-radius:8px;font-size:10.5px;color:var(--mute)}
#tools button:hover{background:var(--panel2);color:var(--text)}
#tools button.on{background:var(--on);border-color:var(--acc);color:var(--onText)}
#tools svg{width:22px;height:22px}
#tools hr{border:0;border-top:1px solid var(--line);margin:6px 8px;width:calc(100% - 16px)}
#tools span{text-align:center;line-height:1.15} /* 80 px fits the longest word (Temperature, 63 px) */
.vn{display:flex;height:22px}.vn .sym{width:17px;height:17px;font-size:10.5px}.vn .sym.lo{margin:5px 0 0 -4px}
#tools kbd{position:absolute;top:3px;right:5px;font-family:var(--mono);font-size:9.5px;color:var(--mute);opacity:.8}
.sym{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:#f2f4f8;font:700 13px/1 var(--font);font-style:normal}
.sym.hi{color:#1d55c2;box-shadow:0 0 0 1.5px #2f6fe0}.sym.lo{color:#d12f2f;box-shadow:0 0 0 1.5px #e03b3b}
/* contextual options bar (top) and time bar (bottom) */
#optbar,#timebar{flex:none;display:flex;align-items:center;gap:14px;padding:0 14px;background:var(--panel);font-size:12.5px;height:46px;overflow:hidden}
#optbar{border-bottom:1px solid var(--line)}
#timebar{border-top:1px solid var(--line)}
.opt{display:flex;align-items:center;gap:12px;white-space:nowrap}
.opt{flex:1;min-width:0}
.opt>*{flex:none}
@media (max-width:1400px){#optSys .hint{display:none}}
.opt>.hint{flex:0 1 auto;color:var(--mute);overflow:hidden;text-overflow:ellipsis;min-width:0}
.opt .hint b{color:var(--text2);font-weight:600}
.opt kbd{font-family:var(--mono);font-size:11px;background:var(--kbd);border:1px solid var(--kbdLine);border-radius:4px;padding:0 4px}
label.ctl{display:flex;align-items:center;gap:7px;white-space:nowrap}
label.ctl input[type=range]{width:84px;flex:none}
label.ctl span.v{font-family:var(--mono);font-size:11.5px;color:var(--acc);min-width:46px}
.seg.sm button{padding:5px 9px;font-size:12px;flex:none}
/* sea chips: value on a second line, so the width depends only on the name */
#seaSeg button{display:flex;flex-direction:column;align-items:center;line-height:1.15;padding:3px 8px}
#seaSeg button em{font-style:normal;font-family:var(--mono);font-size:10.5px;color:var(--acc)}
#seaSeg button em.z{color:var(--mute);opacity:.6}
#seaSeg button.all{font-weight:600}
#timebar .play{min-width:104px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:7px}
#timebar .play svg{width:12px;height:12px;fill:currentColor}
#clock{font-family:var(--mono);font-size:12px;color:var(--text);margin-right:auto;white-space:nowrap}
/* options bar: label + value above the slider, so it fits on one line */
#optbar label.ctl{display:grid;grid-template-columns:1fr auto;column-gap:8px;font-size:11.5px;color:var(--mute);line-height:1.2}
#optbar label.ctl input[type=range]{grid-row:2;grid-column:1/3;width:104px;margin:3px 0 0}
#optbar label.ctl span.v{grid-row:1;grid-column:2;min-width:9ch;text-align:right;font-size:11px}
#optbar #pfLatV{min-width:11ch}
#timebar #tspeedV{min-width:6ch}
#optbar .opt{gap:16px}
/* layers panel */
#layers{border-top:1px solid var(--line)}
.lgrp{display:grid;grid-template-columns:74px 1fr;gap:6px;align-items:start;margin:5px 0}
.lgrp>b{font-size:11.5px;font-weight:500;color:var(--mute);padding-top:5px;line-height:1.25;overflow-wrap:anywhere}
.tiles{display:flex;flex-wrap:wrap;gap:4px}
.tiles button{padding:4px 8px;font-size:12px;border-radius:5px}
.tiles button.on{background:var(--on);border-color:var(--acc);color:var(--onText)}
#wSeg{margin:2px 0 8px 80px}
.ov{display:inline-flex;align-items:center;gap:6px;padding:4px 8px;font-size:12px;border-radius:5px}
.ov .eye{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2}
.ov .eye circle{fill:currentColor;stroke:none}
.ov.on{border-color:var(--hover);color:var(--strong)}.ov.on .eye{color:var(--acc)}
.ov:not(.on){color:var(--mute)}.ov:not(.on) .eye{opacity:.4}
.ov.forced{border-style:dashed;border-color:var(--hover)}
.lgrp>.seg{justify-self:start}
.seg.dis{opacity:.4;pointer-events:none}
#layers h2.sec{margin-top:16px}
.ovs{display:flex;flex-wrap:wrap;gap:4px}
/* tabs */
#tabs{display:flex;border-top:1px solid var(--line);border-bottom:1px solid var(--line);flex:none;padding:0 10px}
#tabs button{flex:1;border:0;border-bottom:2px solid transparent;border-radius:0;background:transparent;padding:9px 4px 7px;color:var(--mute);font-size:13px}
#tabs button.on{color:var(--strong);border-bottom-color:var(--acc)}
.tab{flex:1;min-height:0;overflow-y:auto;padding:12px 16px 30px}
.tab h2{font-size:11.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--mute);margin:0 0 9px;font-weight:600}
.tab.help{font-size:12.5px;color:var(--text2)}.tab.help p{margin:6px 0 9px}
.empty{color:var(--mute);font-size:13px;padding:10px 2px}
h1{font-size:17px;font-weight:600;margin:0 0 2px;letter-spacing:.01em}
.sub{color:var(--mute);font-size:12.5px;margin-bottom:12px}
section h2{font-size:11.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--mute);margin:0 0 9px;font-weight:600}
h3.mini{font-size:12.5px;font-weight:600;margin:12px 0 4px;color:var(--strong)}
label.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:7px 0;font-size:13px}
label.row span.v{font-family:var(--mono);font-size:12px;color:var(--acc);min-width:66px;text-align:right}
select,button{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 9px}
select{width:100%;cursor:pointer}
button{cursor:pointer}
button:hover,select:hover{border-color:var(--hover)}
button.on{background:var(--on);border-color:var(--acc)}
.btns{display:flex;gap:6px;flex-wrap:wrap}
.btns button{flex:1}
.btns.sm button{font-size:12.5px;padding:5px 6px}
.seg{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{flex:1;border:0;border-radius:0;padding:7px 3px;font-size:12px;background:transparent}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--on);color:var(--onText)}
input[type=range]{flex:1;max-width:140px;accent-color:var(--acc)}
.chk{display:flex;gap:6px 14px;flex-wrap:wrap;margin-top:9px;font-size:13px}
.chk label{display:flex;gap:5px;align-items:center;cursor:pointer}
.note{font-size:12px;color:var(--mute);margin-top:6px}
.trF{color:var(--trF)}.trB{color:var(--trB)}
[hidden]{display:none!important}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:12.5px;margin:6px 0 8px}
.kv b{font-weight:500;color:var(--mute)}
.kv span{font-family:var(--mono);font-size:12px;text-align:right}
#forces{width:100%;height:210px;background:var(--inset);border:1px solid var(--line);border-radius:8px;display:block}
.flegend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;margin-top:6px}
.flegend i{display:inline-block;width:10px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}
.explain{font-size:12.5px;color:var(--text2);margin-top:8px}
.wb{display:grid;grid-template-columns:118px 1fr 58px;align-items:center;gap:6px;font-size:11.8px;margin:3px 0}
.wb .bar{position:relative;height:9px;background:var(--inset);border:1px solid var(--line);border-radius:3px}
.wb .bar i{position:absolute;top:0;bottom:0;border-radius:2px}
.wb .bar:after{content:'';position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--barMid)}
.wb span{font-family:var(--mono);font-size:11.5px;text-align:right}
.wb.tot{font-weight:600}
details{font-size:12.5px;color:var(--text2)}
details summary{cursor:pointer;color:var(--text);font-weight:500;margin-bottom:6px}
details p{margin:6px 0}
code{font-family:var(--mono);font-size:11.5px;background:var(--code);padding:1px 4px;border-radius:4px}
.hud{position:absolute;pointer-events:none;font-size:12px;background:var(--hud);border:1px solid var(--hudLine);border-radius:7px;padding:6px 9px;backdrop-filter:blur(4px)}
#cursor{right:12px;bottom:12px;font-family:var(--mono);font-size:11.5px;white-space:nowrap}
#legend{left:12px;bottom:12px;width:290px}
#legend canvas{width:100%;height:10px;display:block;border-radius:3px;margin:4px 0 2px}
#legend .ticks{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10.5px;color:var(--mute)}
#legend .ttl{font-size:11.5px;color:var(--text2)}
#legend .x{font-size:11px;color:var(--mute);margin-top:3px}
@media (max-width:820px){
  html,body{overflow:auto}
  #app{flex-direction:column;height:auto}
  #tools{width:100%;flex-direction:row;border-right:0;border-bottom:1px solid var(--line);padding:4px 6px}
  #tools button{flex:1;flex-direction:row;justify-content:center;gap:6px}
  #tools kbd{display:none}
  #mapcol{flex:none;height:72vh}
  #optbar,#timebar{gap:10px;padding:0 10px;overflow-x:auto}
  #panel{width:100%;border-left:0;border-top:1px solid var(--line)}
  .tab{overflow:visible}
  #legend{width:210px}
}
</style>
</head>
<body>
<div id="app">
  <nav id="tools" data-ta="tools.aria">
    <button data-t="pres" data-tt="tool.pres.tt"><span class="vn"><i class="sym hi" data-tx="sym.H"></i><i class="sym lo" data-tx="sym.L"></i></span><span data-tx="tool.pres"></span><kbd>1</kbd></button>
    <button data-t="temp" data-tt="tool.temp.tt"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 4a2 2 0 0 1 4 0v9.5a4 4 0 1 1-4 0z"/><circle cx="12" cy="17" r="1.6" fill="currentColor"/></svg><span data-tx="tool.temp"></span><kbd>2</kbd></button>
    <button data-t="hum" data-tt="tool.hum.tt"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5s-6 6.8-6 10.9a6 6 0 0 0 12 0c0-4.1-6-10.9-6-10.9z"/></svg><span data-tx="tool.hum"></span><kbd>3</kbd></button>
    <button data-t="pf" data-tt="tool.pf.tt"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 15c3-5 6-5 9 0s6 5 9 0" stroke-dasharray="3 3"/><path d="M12 4v5M9.5 6.5 12 4l2.5 2.5"/></svg><span data-tx="tool.pf"></span><kbd>4</kbd></button>
    <button data-t="sea" data-tt="tool.sea.tt"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9c2-2 4-2 6 0s4 2 6 0 4-2 6 0M3 15c2-2 4-2 6 0s4 2 6 0 4-2 6 0"/></svg><span data-tx="tool.sea"></span><kbd>5</kbd></button>
    <hr>
    <button data-t="probe" data-tt="tool.probe.tt"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="6"/><path d="M12 2v5M12 17v5M2 12h5M17 12h5"/></svg><span data-tx="tool.probe"></span><kbd>6</kbd></button>
  </nav>
  <div id="mapcol">
    <div id="optbar">
      <div class="opt" id="optPres">
        <div class="seg sm" id="addSeg"><button data-a="1" data-tx="add.H" data-tt="add.H.tt"></button><button data-a="-1" data-tx="add.L" data-tt="add.L.tt"></button></div>
        <label class="ctl" data-tt="bg.tt"><span data-tx="bg"></span> <input type="range" id="bg" min="-20" max="30" step="1"><span class="v" id="bgV"></span></label>
        <span class="hint" data-tx="hint.pres"></span>
      </div>
      <div class="opt" id="optSys" hidden>
        <div class="seg sm"><button id="tH" data-tx="sys.H" data-tt="sys.H.tt"></button><button id="tL" data-tx="sys.L" data-tt="sys.L.tt"></button></div>
        <label class="ctl"><span data-tx="sys.amp"></span> <input type="range" id="amp" min="2" max="45" step="0.5"><span class="v" id="ampV"></span></label>
        <label class="ctl"><span data-tx="sys.size"></span> <input type="range" id="size" min="250" max="2500" step="10"><span class="v" id="sizeV"></span></label>
        <label class="ctl"><span data-tx="sys.aspect"></span> <input type="range" id="aspect" min="1" max="3.5" step="0.05"><span class="v" id="aspectV"></span></label>
        <label class="ctl"><span data-tx="sys.rot"></span> <input type="range" id="rot" min="0" max="179" step="1"><span class="v" id="rotV"></span></label>
        <button id="del" data-tx="sys.del" data-tt="sys.del.tt"></button>
        <span class="hint" data-tx="hint.sys"></span>
      </div>
      <div class="opt" id="optTemp" hidden>
        <div class="seg sm" id="tempSeg"><button data-m="cold" data-tx="temp.cold"></button><button data-m="warm" data-tx="temp.warm"></button></div>
        <label class="ctl"><span data-tx="brush.size"></span> <input type="range" class="brushR" min="150" max="700" step="10"><span class="v brushRV"></span></label>
        <span class="hint" data-tx="hint.brush"></span>
      </div>
      <div class="opt" id="optHum" hidden>
        <div class="seg sm" id="humSeg"><button data-m="moist" data-tx="hum.moist"></button><button data-m="dry" data-tx="hum.dry"></button></div>
        <label class="ctl"><span data-tx="brush.size"></span> <input type="range" class="brushR" min="150" max="700" step="10"><span class="v brushRV"></span></label>
        <span class="hint" data-tx="hint.brush"></span>
      </div>
      <div class="opt" id="optPf" hidden>
        <label class="ctl" data-tt="pf.lat.tt"><span data-tx="pf.lat"></span> <input type="range" id="pfLat" min="40" max="62" step="0.5"><span class="v" id="pfLatV"></span></label>
        <label class="ctl" data-tt="pf.dT.tt"><span data-tx="pf.dT"></span> <input type="range" id="pfDT" min="6" max="32" step="1"><span class="v" id="pfDTV"></span></label>
        <span class="hint" data-tx="hint.pf"></span>
      </div>
      <div class="opt" id="optSea" hidden>
        <div class="seg sm" id="seaSeg"></div>
        <label class="ctl" data-tt="sea.tt"><span id="sstName"></span> <input type="range" id="sst" min="-5" max="5" step="0.5"><span class="v" id="sstV"></span></label>
        <button id="seaReset" data-tx="sea.reset" data-tt="sea.reset.tt"></button>
        <span class="hint" data-tx="hint.sea"></span>
      </div>
      <div class="opt" id="optProbe" hidden>
        <span class="hint" data-tx="hint.probe"></span>
      </div>
    </div>
    <div id="mapwrap">
      <canvas id="map"></canvas>
      <div id="legend" class="hud"><div class="ttl" id="legTitle"></div><canvas id="legBar" width="290" height="10"></canvas><div class="ticks" id="legTicks"></div><div class="x" id="legX"></div></div>
      <div id="cursor" class="hud" hidden></div>
    </div>
    <div id="timebar">
      <button id="pause" class="play" data-tt="time.pause.tt"></button>
      <label class="ctl" data-tt="time.speed.tt"><span data-tx="time.speed"></span> <input type="range" id="tspeed" min="1" max="24" step="1"><span class="v" id="tspeedV"></span></label>
      <span id="clock"></span>
      <button id="resetT" data-tx="time.reset" data-tt="time.reset.tt"></button>
    </div>
  </div>
  <aside id="panel">
    <header>
      <div class="hrow">
        <h1 data-tx="app.h1"></h1>
        <select id="lang" data-tt="lang.tt"></select>
        <button id="theme" class="icon"></button>
      </div>
      <div class="sub" data-tx="app.sub"></div>
      <select id="preset" data-tt="preset.tt"></select>
    </header>

    <section id="layers">
      <h2 data-tx="lay.title"></h2>
      <div class="lgrp"><b data-tx="grp.wx"></b><div class="tiles"><button data-l="cloud" data-tx="lay.cloud" data-tt="lay.cloud.tt"></button><button data-l="precip" data-tx="lay.precip" data-tt="lay.precip.tt"></button><button data-l="vvel" data-tx="lay.vvel" data-tt="lay.vvel.tt"></button><button data-l="rh" data-tx="lay.rh" data-tt="lay.rh.tt"></button></div></div>
      <div class="seg sm" id="wSeg"><button data-w="tot" data-tx="w.tot"></button><button data-w="dyn" data-tx="w.dyn" data-tt="w.dyn.tt"></button><button data-w="ek" data-tx="w.ek" data-tt="w.ek.tt"></button><button data-w="oro" data-tx="w.oro"></button></div>
      <div class="lgrp"><b data-tx="grp.air"></b><div class="tiles"><button data-l="temp" data-tx="lay.temp" data-tt="lay.temp.tt"></button><button data-l="teq" data-tx="lay.teq" data-tt="lay.teq.tt"></button><button data-l="dust" data-tx="lay.dust" data-tt="lay.dust.tt"></button></div></div>
      <div class="lgrp"><b data-tx="grp.wind"></b><div class="tiles"><button data-l="speed" data-tx="lay.speed" data-tt="lay.speed.tt"></button><button data-l="pres" data-tx="lay.pres" data-tt="lay.pres.tt"></button></div></div>

 'tx.grad':(curv,weaker,r,k)=>`Proudění je <b>${curv}</b>, takže gradientový vítr je ${weaker?'slabší':'silnější'} než geostrofický (${r}×). ${k==='s'?'':k==='c'?'Kolem níže odstředivá síla pomáhá Coriolisově síle.':'Kolem výše odstředivá síla působí s tlakovou silou, a tak musí být vítr rychlejší.'}`,
 'tx.sfc':(surf,al,pc)=>`Tření (${surf}) brzdí vzduch, slabší Coriolisova síla nevyrovná tlakovou sílu, a tak se vítr stáčí o ≈${al}° přes izobary k nižšímu tlaku. Proto se vzduch v níži sbíhá (a stoupá) a ve výši rozbíhá (a klesá). Vítr v 10 m je ještě o ${pc} % slabší.`,
 'tx.resid':rp=>`(Nevyrovnaný zbytek ${rp} % = zjednodušení modelu.)`,
 help:`<p><b>Tlakové pole</b> (ovládáš ty) = 1013 hPa + zonální pozadí + eliptické výše a níže. Z něj se počítá vítr: <b>geostrofický</b> <code>V = (1/ρf)·k × ∇p</code>, <b>gradientový</b> (+ zakřivení izobar, <code>V²κ + fV = fV<sub>g</sub></code>) a <b>přízemní</b> (lineární tření stočí vítr o <code>atan(k/f)</code> k nižšímu tlaku).</p>
<p><b>Vzduchové hmoty:</b> teplotu ve 850 hPa a vlhkost unáší gradientový vítr. Pomalu se vracejí ke klimatologii chladného pololetí (polární fronta). Nad mořem se vzduch otepluje a zvlhčuje, tím víc, čím je studenější než moře.</p>
<p><b>Výškový vítr</b> = přízemní geostrofický + <b>termický vítr</b> <code>(R/f)·ln(p₀/p)·k × ∇T</code>. Nad teplotním kontrastem tak vzniká tryskové proudění.</p>
<p><b>Vertikální pohyby</b> mají tři příčiny:</p>
<p>① <b>Q-vektory</b> (kvazigeostrofická omega rovnice <code>(σ∇² − f²π²/Δp²)ω = −2∇·Q</code>, kde <code>Q = −(R/p)(∂V<sub>g</sub>/∂x·∇T, ∂V<sub>g</sub>/∂y·∇T)</code>): výstup na frontách a při teplé advekci, sestup za studenou frontou. Řeší se iteračně na mřížce.<br>② <b>Ekmanovo čerpání</b>: tření stáčí vítr do níží, vzduch se tam sbíhá a stoupá. Ve výších se rozbíhá a klesá.<br>③ <b>Hory</b>: proudění proti svahu vzduch zvedá, na závětrné straně klesá (fén).</p>
<p><b>Oblačnost a srážky:</b> stoupající vzduch se ochlazuje, takže nasycení klesá jako <code>q<sub>s</sub>·e<sup>−γz</sup></code>. Nadbytečná vodní pára zkondenzuje na oblačnou vodu, ta se unáší, při sestupu se vypařuje a nad prahem vypadává jako srážky. Kde je vzduch ve 850 hPa o víc než ~13 K studenější než moře, vznikají <b>přeháňkové buňky</b>.</p>
<p><b>Fronty</b> se nekreslí ručně. Detekují se jako osy maxima teplotního gradientu (zostřeného deformací proudění). Podle advekce přes frontu se určí, zda je teplá, nebo studená.</p>
<p><b>Co tu není:</b> vývoj a postup tlakových systémů, zpětná vazba teploty na tlak, uvolněné latentní teplo, inverzní oblačnost a mlhy, denní chod, letní konvekce. Hory jsou přibližné elipsy. Tlak je stacionární, takže fronty dosáhnou rovnovážného tvaru a dál se nevyvíjejí.</p>
<p class="note">Data pobřeží: Natural Earth (public domain).</p>`},

 'ex.showers':(t,s,d)=>`<b>Shower clouds.</b> Cold air (${t} °C at 850 hPa) flows over a warm sea (${s} °C). The difference of ${d} K exceeds ~13 K; the air is heated and moistened from below, so it is unstable and forms convective cells. Over land the showers weaken.`,
 'ex.cloudy':(pr,w,z,dom,snow)=>`<b>Cloudy${pr?' with precipitation':''}.</b> The air is rising here (${w} cm/s, in total about ${z} m) and cools as it rises until it becomes saturated. Main cause: <b>${dom}</b>.${snow?' At 850 hPa it is below −2 °C, so precipitation falls as snow.':''}`,
 'ex.clear':(w,rh,dom)=>`<b>Mostly clear.</b> The air is sinking (${w} cm/s); as it descends it warms adiabatically and its relative humidity drops (${rh} %). Main cause: <b>${dom}</b>.`,

 'tx.jet':(g,v)=>`At 300 hPa the <b>thermal wind</b> is added to the surface geostrophic wind. It is proportional to the temperature gradient (here ${g} K/100 km) and blows along the isotherms with cold air on the left. Result: ${v} m/s. The diagram shows the surface geostrophic balance.`,
 'tx.geo':'The pressure gradient force (from higher to lower pressure) is exactly balanced by the Coriolis force, which acts perpendicular to the right of the motion. So the wind blows along the isobars.',
 'tx.anom':'The gradient wind equation has no solution here: the high is too sharp for its size. The wind is limited to 2×V<sub>g</sub>. ',
 'tx.grad':(curv,weaker,r,k)=>`The flow is <b>${curv}</b>, so the gradient wind is ${weaker?'weaker':'stronger'} than the geostrophic wind (${r}×). ${k==='s'?'':k==='c'?'Around a low the centrifugal force helps the Coriolis force.':'Around a high the centrifugal force acts together with the pressure gradient force, so the wind must be faster.'}`,
 'tx.sfc':(surf,al,pc)=>`Friction (${surf}) slows the air, the weaker Coriolis force no longer balances the pressure gradient force, and so the wind turns by ≈${al}° across the isobars towards lower pressure. That is why air converges (and rises) in a low and diverges (and sinks) in a high. The wind at 10 m is another ${pc} % weaker.`,
 'tx.resid':rp=>`(Unbalanced remainder ${rp} % = model simplification.)`,
 help:`<p><b>Pressure field</b> (you control it) = 1013 hPa + zonal background + elliptical highs and lows. The wind is computed from it: <b>geostrophic</b> <code>V = (1/ρf)·k × ∇p</code>, <b>gradient</b> (+ isobar curvature, <code>V²κ + fV = fV<sub>g</sub></code>) and <b>surface</b> (linear friction turns the wind by <code>atan(k/f)</code> towards lower pressure).</p>
<p><b>Air masses:</b> the 850 hPa temperature and the humidity are carried by the gradient wind. They slowly relax towards the cold-season climatology (polar front). Over the sea the air is warmed and moistened, the more so the colder it is than the sea.</p>
<p><b>Upper-level wind</b> = surface geostrophic + <b>thermal wind</b> <code>(R/f)·ln(p₀/p)·k × ∇T</code>. A jet stream thus forms above a temperature contrast.</p>
<p><b>Vertical motion</b> has three causes:</p>
<p>① <b>Q-vectors</b> (quasi-geostrophic omega equation <code>(σ∇² − f²π²/Δp²)ω = −2∇·Q</code>, where <code>Q = −(R/p)(∂V<sub>g</sub>/∂x·∇T, ∂V<sub>g</sub>/∂y·∇T)</code>): ascent at fronts and with warm advection, descent behind a cold front. Solved iteratively on the grid.<br>② <b>Ekman pumping</b>: friction turns the wind into lows, so the air converges there and rises. In highs it diverges and sinks.<br>③ <b>Mountains</b>: flow against a slope lifts the air; on the lee side it descends (foehn).</p>
<p><b>Clouds and precipitation:</b> rising air cools, so the saturation value drops as <code>q<sub>s</sub>·e<sup>−γz</sup></code>. Excess water vapour condenses into cloud water, which is carried along, evaporates in descending air and falls out as precipitation above a threshold. Where the air at 850 hPa is more than ~13 K colder than the sea, <b>shower cells</b> form.</p>
<p><b>Fronts</b> are not drawn by hand. They are detected as axes of maximum temperature gradient (sharpened by deformation of the flow). The advection across the front decides whether it is warm or cold.</p>
<p><b>What is missing:</b> development and movement of pressure systems, feedback of temperature on pressure, latent heat release, inversion clouds and fog, the diurnal cycle, summer convection. Mountains are rough ellipses. Pressure is stationary, so fronts reach an equilibrium shape and do not evolve further.</p>
<p class="note">Coastline data: Natural Earth (public domain).</p>`},

 'tx.jet':(g,v)=>`In 300 hPa addiert sich zum geostrophischen Bodenwind der <b>thermische Wind</b>. Er ist proportional zum Temperaturgradienten (hier ${g} K/100 km) und weht entlang der Isothermen, die kalte Luft zur Linken. Ergebnis: ${v} m/s. Das Diagramm zeigt das geostrophische Gleichgewicht am Boden.`,
 'tx.geo':'Die Druckgradientkraft (vom höheren zum tieferen Druck) wird genau von der Corioliskraft ausgeglichen, die senkrecht rechts zur Bewegungsrichtung wirkt. Deshalb weht der Wind entlang der Isobaren.',
 'tx.anom':'Die Gradientwindgleichung hat hier keine Lösung: das Hoch ist für seine Größe zu scharf. Der Wind ist auf 2×V<sub>g</sub> begrenzt. ',
 'tx.grad':(curv,weaker,r,k)=>`Die Strömung ist <b>${curv}</b>, daher ist der Gradientwind ${weaker?'schwächer':'stärker'} als der geostrophische Wind (${r}×). ${k==='s'?'':k==='c'?'Um ein Tief unterstützt die Zentrifugalkraft die Corioliskraft.':'Um ein Hoch wirkt die Zentrifugalkraft zusammen mit der Druckkraft, daher muss der Wind schneller sein.'}`,
 'tx.sfc':(surf,al,pc)=>`Die Reibung (${surf}) bremst die Luft, die schwächere Corioliskraft gleicht die Druckkraft nicht mehr aus, und so dreht der Wind um ≈${al}° über die Isobaren zum tieferen Druck. Deshalb konvergiert die Luft im Tief (und steigt auf) und divergiert im Hoch (und sinkt ab). Der Wind in 10 m ist noch um ${pc} % schwächer.`,
 'tx.resid':rp=>`(Unausgeglichener Rest ${rp} % = Vereinfachung des Modells.)`,
 help:`<p><b>Druckfeld</b> (steuerst du) = 1013 hPa + zonaler Hintergrund + elliptische Hochs und Tiefs. Daraus wird der Wind berechnet: <b>geostrophisch</b> <code>V = (1/ρf)·k × ∇p</code>, <b>Gradientwind</b> (+ Krümmung der Isobaren, <code>V²κ + fV = fV<sub>g</sub></code>) und <b>Bodenwind</b> (lineare Reibung dreht den Wind um <code>atan(k/f)</code> zum tieferen Druck).</p>
<p><b>Luftmassen:</b> Die Temperatur in 850 hPa und die Feuchte werden vom Gradientwind verfrachtet. Sie kehren langsam zur Klimatologie des Winterhalbjahres (Polarfront) zurück. Über dem Meer wird die Luft erwärmt und befeuchtet, umso stärker, je kälter sie als das Meer ist.</p>
<p><b>Höhenwind</b> = geostrophischer Bodenwind + <b>thermischer Wind</b> <code>(R/f)·ln(p₀/p)·k × ∇T</code>. Über einem Temperaturgegensatz entsteht so ein Strahlstrom.</p>
<p><b>Vertikalbewegungen</b> haben drei Ursachen:</p>
<p>① <b>Q-Vektoren</b> (quasigeostrophische Omega-Gleichung <code>(σ∇² − f²π²/Δp²)ω = −2∇·Q</code>, mit <code>Q = −(R/p)(∂V<sub>g</sub>/∂x·∇T, ∂V<sub>g</sub>/∂y·∇T)</code>): Hebung an Fronten und bei Warmluftadvektion, Absinken hinter der Kaltfront. Wird iterativ auf dem Gitter gelöst.<br>② <b>Ekman-Pumpen</b>: Die Reibung lenkt den Wind ins Tief, die Luft konvergiert dort und steigt auf. Im Hoch divergiert sie und sinkt ab.<br>③ <b>Gebirge</b>: Anströmung eines Hangs hebt die Luft, auf der Leeseite sinkt sie ab (Föhn).</p>
<p><b>Bewölkung und Niederschlag:</b> Aufsteigende Luft kühlt sich ab, daher sinkt der Sättigungswert wie <code>q<sub>s</sub>·e<sup>−γz</sup></code>. Überschüssiger Wasserdampf kondensiert zu Wolkenwasser, das verfrachtet wird, beim Absinken verdunstet und oberhalb einer Schwelle als Niederschlag ausfällt. Wo die Luft in 850 hPa um mehr als ~13 K kälter als das Meer ist, bilden sich <b>Schauerzellen</b>.</p>
<p><b>Fronten</b> werden nicht von Hand gezeichnet. Sie werden als Achsen maximalen Temperaturgradienten erkannt (verschärft durch die Deformation der Strömung). Die Advektion über die Front entscheidet, ob sie warm oder kalt ist.</p>
<p><b>Was fehlt:</b> Entwicklung und Verlagerung der Drucksysteme, Rückkopplung der Temperatur auf den Druck, freigesetzte latente Wärme, Inversionsbewölkung und Nebel, Tagesgang, sommerliche Konvektion. Gebirge sind grobe Ellipsen. Der Druck ist stationär, daher erreichen Fronten eine Gleichgewichtsform und entwickeln sich nicht weiter.</p>
<p class="note">Küstendaten: Natural Earth (gemeinfrei).</p>`},

 'tx.jet':(g,v)=>`A 300 hPa al vento geostrofico al suolo si somma il <b>vento termico</b>, proporzionale al gradiente termico (qui ${g} K/100 km), che soffia lungo le isoterme con l'aria fredda a sinistra. Risultato: ${v} m/s. Il diagramma mostra l'equilibrio geostrofico al suolo.`,
 'tx.geo':'La forza del gradiente di pressione (dalla pressione maggiore alla minore) è esattamente bilanciata dalla forza di Coriolis, che agisce perpendicolarmente a destra del moto. Per questo il vento soffia lungo le isobare.',
 'tx.anom':"L'equazione del vento di gradiente qui non ha soluzione: l'alta è troppo accentuata per la sua dimensione. Il vento è limitato a 2×V<sub>g</sub>. ",
 'tx.grad':(curv,weaker,r,k)=>`Il flusso è <b>${curv}</b>, quindi il vento di gradiente è ${weaker?'più debole':'più forte'} del vento geostrofico (${r}×). ${k==='s'?'':k==='c'?'Attorno a una bassa la forza centrifuga aiuta la forza di Coriolis.':"Attorno a un'alta la forza centrifuga agisce insieme alla forza di pressione, quindi il vento deve essere più veloce."}`,
 'tx.sfc':(surf,al,pc)=>`L'attrito (${surf}) frena l'aria, la forza di Coriolis più debole non bilancia più la forza di pressione e così il vento ruota di ≈${al}° attraverso le isobare verso la pressione minore. Per questo nella bassa l'aria converge (e sale) e nell'alta diverge (e scende). Il vento a 10 m è ancora più debole del ${pc} %.`,
 'tx.resid':rp=>`(Residuo non bilanciato ${rp} % = semplificazione del modello.)`,
 help:`<p><b>Campo di pressione</b> (lo controlli tu) = 1013 hPa + fondo zonale + alte e basse pressioni ellittiche. Da esso si calcola il vento: <b>geostrofico</b> <code>V = (1/ρf)·k × ∇p</code>, <b>di gradiente</b> (+ curvatura delle isobare, <code>V²κ + fV = fV<sub>g</sub></code>) e <b>al suolo</b> (l'attrito lineare ruota il vento di <code>atan(k/f)</code> verso la pressione minore).</p>
<p><b>Masse d'aria:</b> la temperatura a 850 hPa e l'umidità sono trasportate dal vento di gradiente. Tornano lentamente alla climatologia del semestre freddo (fronte polare). Sul mare l'aria si riscalda e si inumidisce, tanto più quanto è più fredda del mare.</p>
<p><b>Vento in quota</b> = geostrofico al suolo + <b>vento termico</b> <code>(R/f)·ln(p₀/p)·k × ∇T</code>. Sopra un contrasto termico si forma così la corrente a getto.</p>
<p><b>I moti verticali</b> hanno tre cause:</p>
<p>① <b>Vettori Q</b> (equazione omega quasi-geostrofica <code>(σ∇² − f²π²/Δp²)ω = −2∇·Q</code>, dove <code>Q = −(R/p)(∂V<sub>g</sub>/∂x·∇T, ∂V<sub>g</sub>/∂y·∇T)</code>): ascesa sui fronti e con avvezione calda, discesa dietro il fronte freddo. Risolta iterativamente sulla griglia.<br>② <b>Pompaggio di Ekman</b>: l'attrito devia il vento verso le basse pressioni, dove l'aria converge e sale. Nelle alte pressioni diverge e scende.<br>③ <b>Montagne</b>: il flusso contro un pendio solleva l'aria, sul lato sottovento scende (foehn).</p>
<p><b>Nubi e precipitazioni:</b> l'aria che sale si raffredda, quindi il valore di saturazione cala come <code>q<sub>s</sub>·e<sup>−γz</sup></code>. Il vapore in eccesso condensa in acqua di nube, che viene trasportata, evapora nell'aria in discesa e oltre una soglia cade come precipitazione. Dove l'aria a 850 hPa è più fredda del mare di oltre ~13 K, si formano <b>celle di rovesci</b>.</p>
<p><b>I fronti</b> non si disegnano a mano. Si individuano come assi di massimo gradiente termico (accentuato dalla deformazione del flusso). L'avvezione attraverso il fronte decide se è caldo o freddo.</p>
<p><b>Cosa manca:</b> evoluzione e spostamento dei sistemi di pressione, retroazione della temperatura sulla pressione, rilascio di calore latente, nubi d'inversione e nebbie, ciclo diurno, convezione estiva. Le montagne sono ellissi approssimative. La pressione è stazionaria, quindi i fronti raggiungono una forma di equilibrio e non evolvono oltre.</p>
<p class="note">Dati delle coste: Natural Earth (pubblico dominio).</p>`},

 'tx.geo':'La prema forto (de pli alta al pli malalta premo) estas ekzakte ekvilibrigita de la Koriolisa forto, kiu agas perpendikle dekstre de la movo. Tial la vento blovas laŭ la izobaroj.',

 'tx.sfc':(surf,al,pc)=>`Frotado (${surf}) bremsas la aeron, la pli malforta Koriolisa forto ne plu ekvilibrigas la preman forton, kaj tiel la vento turniĝas je ≈${al}° trans la izobaroj al la pli malalta premo. Tial en malaltpremo la aero konverĝas (kaj leviĝas) kaj en altpremo diverĝas (kaj sinkas). La vento je 10 m estas ankoraŭ ${pc} % pli malforta.`,
 'tx.resid':rp=>`(Neekvilibrigita resto ${rp} % = simpligo de la modelo.)`,
 help:`<p><b>Premokampo</b> (vi regas ĝin) = 1013 hPa + zona fono + elipsaj altpremoj kaj malaltpremoj. El ĝi oni kalkulas la venton: <b>geostrofa</b> <code>V = (1/ρf)·k × ∇p</code>, <b>gradienta</b> (+ kurbeco de la izobaroj, <code>V²κ + fV = fV<sub>g</sub></code>) kaj <b>surgrunda</b> (lineara frotado turnas la venton je <code>atan(k/f)</code> al la pli malalta premo).</p>
<p><b>Aermasoj:</b> la temperaturon je 850 hPa kaj la humidon portas la gradienta vento. Ili malrapide revenas al la klimatologio de la malvarma duonjaro (polusa fronto). Super la maro la aero varmiĝas kaj humidiĝas, des pli, ju pli malvarma ĝi estas ol la maro.</p>
<p><b>Altnivela vento</b> = surgrunda geostrofa + <b>termika vento</b> <code>(R/f)·ln(p₀/p)·k × ∇T</code>. Super temperatura kontrasto tiel estiĝas jetfluo.</p>
<p><b>Vertikalaj movoj</b> havas tri kaŭzojn:</p>
<p>① <b>Q-vektoroj</b> (kvazaŭgeostrofa omega-ekvacio <code>(σ∇² − f²π²/Δp²)ω = −2∇·Q</code>, kie <code>Q = −(R/p)(∂V<sub>g</sub>/∂x·∇T, ∂V<sub>g</sub>/∂y·∇T)</code>): supreniro ĉe frontoj kaj ĉe varma advekcio, malsupreniro malantaŭ malvarma fronto. Solvata iterace sur la krado.<br>② <b>Ekman-pumpado</b>: frotado turnas la venton en la malaltpremojn, la aero tie konverĝas kaj leviĝas. En altpremoj ĝi diverĝas kaj sinkas.<br>③ <b>Montoj</b>: fluo kontraŭ deklivo levas la aeron, sur la ŝirmflanko ĝi malleviĝas (fenvento).</p>
<p><b>Nuboj kaj precipitaĵoj:</b> leviĝanta aero malvarmiĝas, do la saturiĝa valoro malkreskas kiel <code>q<sub>s</sub>·e<sup>−γz</sup></code>. La troa akvovaporo kondensiĝas en nuban akvon, kiu estas portata, vaporiĝas en sinkanta aero kaj super sojlo falas kiel precipitaĵo. Kie la aero je 850 hPa estas pli ol ~13 K pli malvarma ol la maro, estiĝas <b>duŝaj ĉeloj</b>.</p>
<p><b>Frontoj</b> ne estas desegnataj mane. Ili estas detektataj kiel aksoj de maksimuma temperatura gradiento (akrigita de la deformado de la fluo). La advekcio trans la fronto decidas, ĉu ĝi estas varma aŭ malvarma.</p>
<p><b>Kio mankas:</b> evoluo kaj movo de la premsistemoj, retroefiko de la temperaturo sur la premon, liberigita latenta varmo, inversiaj nuboj kaj nebuloj, taga ciklo, somera konvekcio. Montoj estas proksimumaj elipsoj. La premo estas senmova, do frontoj atingas ekvilibran formon kaj ne plu evoluas.</p>
<p class="note">Datumoj pri marbordoj: Natural Earth (publika havaĵo).</p>`}

let THEME={}; // canvas colours read from the CSS variables of the active theme

  const cs=getComputedStyle(document.documentElement);THEME={};for(const k of ['bg','fP','fC','fF','fE','fV','fIso','fLo','fHi'])THEME[k]=cs.getPropertyValue('--'+k).trim();
  $('theme').innerHTML=THEME_ICON[themePref];$('theme').title=t('theme.'+themePref);updateProbe();}
mqDark.addEventListener('change',()=>{if(themePref==='auto')applyTheme();});
$('theme').onclick=()=>{themePref=THEMES[(THEMES.indexOf(themePref)+1)%THEMES.length];pref.set('theme',themePref);applyTheme();};
applyTheme();applyLang(pickLang());
new ResizeObserver(()=>resize()).observe($('mapwrap'));
resize();presetSel.value=0;loadPreset(0);setTab('probe');setTool('pres');requestAnimationFrame(frame);
</script>
